[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "irish-data"
version = "0.1.0"
description = "Pipeline that loads Irish open data from the CSO into SQLite"
requires-python = ">=3.11"
dependencies = ["requests"]

[tool.setuptools.packages.find]
where = ["src"]